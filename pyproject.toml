[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xplanation-space"
version = "0.1.0"
description = "Topological analysis utilities for temporal graph sequences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.23",
  "networkx>=3.6",
  "scipy>=1.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "gudhi>=3.9",
  "persim>=0.3.5",
  "kmapper>=2.0",
  "kneed>=0.8.5",
]

[project.optional-dependencies]
train = [
    "matplotlib>=3.8",
    "torch>=2.0.0",
    "torch-geometric>=2.0.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
xplain-server = "xplain_pipeline.server:main"
xplain-recompute-hsnet = "xplain_pipeline.analysis.persistence:main"

[tool.setuptools.packages.find]
include = ["temporal_tda*", "xplain_pipeline*"]
